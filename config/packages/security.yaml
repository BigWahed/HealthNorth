security:
    # Symfony hashe automatiquement le mot de passe saisi au login
    # et le compare au hash stocke en base (app_user.password).
    password_hashers:
        App\Entity\User: 'auto'

    # Provider base de donnees: on charge l'utilisateur par son email.
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            custom_authenticator: App\Security\LoginFormAuthenticator
            entry_point: App\Security\LoginFormAuthenticator

            logout:
                path: app_logout
                target: app_login

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/pro, roles: ROLE_PRO }
        - { path: ^/patient, roles: ROLE_PATIENT }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
